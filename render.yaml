services:
  - type: web
    name: cna-academy-api
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: APP_ORIGIN
        value: https://www.cnatrainingacademy.org
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cna_academy
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: CNA Training Academy <verification@cnatrainingacademy.org>
      - key: OTP_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: sayflux04@gmail.com
